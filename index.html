<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Splash Screen</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #333;
    }

    .splash-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-size: 24px;
      background: linear-gradient(45deg, #333, #555);
      color: #fff;
      transition: opacity 1s, transform 1s;
      transform: scale(1);
    }

    .splash-screen.hide {
      opacity: 0;
      transform: scale(1.2);
      pointer-events: none;
    }

    .splash-text {
      font-size: 48px;
      font-weight: bold;
      margin-bottom: 20px;
      animation: slide-in 1s;
    }

    .splash-subtext {
      font-size: 24px;
      margin-bottom: 20px;
      animation: fade-in 2s;
    }

    .splash-quote {
      font-size: 18px;
      margin-bottom: 40px;
      animation: fade-in 3s;
    }

    .splash-link {
      font-size: 18px;
      text-decoration: none;
      padding: 10px 20px;
      border-radius: 5px;
      transition: background-color 0.5s, color 0.5s;
      animation: pulse 2s infinite;
      color: #fff;
      border: 1px solid #fff;
    }

    .splash-link:hover {
      background-color: #fff;
      color: #333;
    }

    .splash-time {
      font-size: 18px;
      margin-top: 20px;
      animation: fade-in 4s;
    }

    .splash-location {
      font-size: 18px;
      margin-top: 10px;
      animation: fade-in 5s;
    }

    @keyframes slide-in {
      0% {
        transform: translateY(-100px);
        opacity: 0;
      }
      100% {
        transform: translateY(0);
        opacity: 1;
      }
    }

    @keyframes fade-in {
      0% {
        opacity: 0;
      }
      100% {
        opacity: 1;
      }
    }

    @keyframes pulse {
      0% {
        transform: scale(1);
      }
      50% {
        transform: scale(1.1);
      }
      100% {
        transform: scale(1);
      }
    }
  </style>
</head>
<body>
  <div class="splash-screen" id="splash-screen">
    <div class="splash-subtext">Hello, <span id="country"></span>!</div>
    <div class="splash-text">Welcome to Michael Web!</div>
    <div class="splash-subtext">We're glad you're here 😊</div>
    <div class="splash-quote" id="quote"></div>
    <a href="https://michaelweb.com.ng" class="splash-link">Enter Site</a>
    <div class="splash-time" id="time"></div>
    <div class="splash-location" id="location"></div>
  </div>

  <script>
    // Get current time and date
    const currentTime = new Date().toLocaleTimeString();
    const currentDate = new Date().toLocaleDateString();
    document.getElementById('time').innerText = `${currentTime} | ${currentDate}`;

    // Get user's location using the Geolocation API
    navigator.geolocation.getCurrentPosition((position) => {
      const latitude = position.coords.latitude;
      const longitude = position.coords.longitude;

      // Use the Google Maps Geocoding API to get the location name
      fetch(`https://maps.googleapis.com/maps/api/geocode/json?latlng=${latitude},${longitude}&key=YOUR_API_KEY`)
        .then((response) => response.json())
        .then((data) => {
          const location = data.results[0].formatted_address;
          document.getElementById('location').innerText = location;
        })
        .catch((error) => console.error(error));
    }, (error) => {
      console.error(error);
    });

    // Get user's country using the IP-API
    fetch('https://ip-api.com/json')
      .then((response) => response.json())
      .then((data) => {
        document.getElementById('country').innerText = data.country;
      })
      .catch((error) => console.error(error));

    // Get a random quote
    const quotes = [
      'Believe you can and you\'re halfway there. - Theodore Roosevelt',
      'The only way to do great work is to love what you do. - Steve Jobs',
      'Success is not final, failure is not fatal: It is the courage to continue that counts. - Winston Churchill',
      'Don\'t watch the clock; do what it does. Keep going. - Sam Levenson',
      'You miss 100% of the shots you don\'t take. - Wayne Gretzky',
    ];
    document.getElementById('quote').innerText = quotes[Math.floor(Math.random() * quotes.length)];

    // Hide splash screen after duration
    setTimeout(() => {
      document.getElementById('splash-screen').classList.add('hide');
    }, 100000);

    // Add event listener to link
    document.querySelector('.splash-link').addEventListener('click', (e) => {
      e.preventDefault();
      document.getElementById('splash-screen').classList.add('hide');
      setTimeout(() => {
        window.location.href = 'https://chukwuemeka119.github.io/Michaelweb/';
      }, 1000);
    });
  </script>
</body>
</html>
